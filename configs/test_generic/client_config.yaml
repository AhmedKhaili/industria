client:
  nom: "Test Generic"
  site: "Lab"
  secteur: "test"
  langue: "fr"
  version: "1.0"

dataset:
  format: "LONG"
  source: "csv"
  fichier: "data/test.csv"
  separateur: ";"
  encoding: "utf-8"

  colonnes:
    temps: "Date"
    valeur: "Value"
    tag: "Tag"
    piece: "Piece"
    operation: "Operation"
    machine: "Machine"

  operations_actives: ["USINAGE", "CONTROLE"]

  modeles_actifs:
    - "P-A100"
    - "P-B200"

  s1_parsing:
    piece_patterns:
      - '\b(P-[A-Z][0-9]{3})\b'
    operations_synonymes:
      USINAGE: [usinage, a l usinage, au usinage]
      CONTROLE: [controle, contrôle, au controle]

entites:
  facteurs_analyse:
    USINAGE:
      machine:
        description: "machine d usinage"
        colonne: "Machine"
        synonymes: [machine, poste]
    COMMUN:
      fournisseur:
        description: "fournisseur matiere"
        colonne: "Fournisseur"
        synonymes: [fournisseur, origine]
  groupes_variables:
    USINAGE:
      diametre:
        description: "diametre usine"
        pattern_tag: "DIA_*"
        synonymes: [diametre, diamètre]
    CONTROLE:
      rugosite:
        description: "rugosite mesuree"
        pattern_tag: "RUG_*"
        synonymes: [rugosite, rugosité]
  intentions:
    conformite:
      description: "conformite aux tolerances"
      synonymes: [conforme, conformes, cpk, qualite]
    comparaison_groupes:
      description: "comparer des groupes"
      synonymes: [impact, comparer, entre]

pieces:
  P-A100:
    description: "Piece test A"
    operations:
      USINAGE:
        group_by_defaut: "Machine"
        tags:
          DIA_01: {lti: 9.9, lts: 10.1, nominal: 10.0, unite: "mm"}
      CONTROLE:
        group_by_defaut: "Machine"
        tags:
          RUG_01: {lti: 0.0, lts: 1.6, nominal: 0.8, unite: "um"}
  P-B200:
    description: "Piece test B"
    operations:
      USINAGE:
        group_by_defaut: "Machine"
        tags:
          DIA_01: {lti: 19.9, lts: 20.1, nominal: 20.0, unite: "mm"}

temps: {}

rapport_pdf:
  version: "4.0"
  industria_version: "v4.0"
  max_graphiques_directeur: 3
  max_graphiques_technicien: 12
  sauvegarder_dans: "reports/"
  verdict_libelles:
    GO: "GO — Procédé sous contrôle"
    NO_GO: "NO-GO — Action corrective requise"
    NO_GO_OPERATIONNEL: "NO-GO opérationnel — Intervention urgente"
    SURVEILLANCE: "SURVEILLANCE — Suivi renforcé"

recommandations:
  seuils_cpk:
    p1_sous: 1.0
    p2_sous: 1.33
    p3_sous: 1.67
  zscore:
    absolu_p1: 3.0
    anomaly_pct_p1: 20.0
    anomaly_pct_p2: 10.0
  delais:
    P1: "immédiat"
    P2: "48 heures"
    P3: "semaine en cours"
    P4: "surveillance standard"
  responsables_par_profil:
    operateur: "chef d'équipe"
    technicien: "responsable qualité"
    ingenieur: "direction technique"
    directeur: "direction générale"
  regroupement_causes: []
  rag:
    min_relevance: 0.7
    message_vide: "Aucune procédure locale trouvée. Contacter l'ingénieur procédé."
  detail_par_profil:
    technicien:
      inclure_priorites: ["P1", "P2", "P3", "P4"]
      agreger_p2_p3: false

profils:
  technicien:
    tokens_max: 250
    forbidden_words: []
financier: {}
