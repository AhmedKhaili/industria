# ============================================================
# CLIENT CONFIG — IndustrIA v2.0
# Client démo aéronautique (portfolio — dossier configs/lisi_aerospace inchangé)
# Auteur : Ahmed Khaili
# Date   : Mai 2026
# ============================================================

client:
  nom: "Demo Aerospace Client"
  site: "Site démo"
  secteur: "aeronautique"
  langue: "fr"
  version: "1.0"
  changelog:
    - version: "1.0"
      date: "2026-05-22"
      auteur: "Ahmed Khaili"
      note: "Configuration initiale client démo aéronautique"

# ============================================================
# DATASET — export LONG (9 cols legacy / 18 cols traçabilité)
# ============================================================

dataset:
  format: "LONG"
  source: "csv"
  # Actif S2 aujourd'hui — ne pas basculer avant Phase I3 (tests + rebuild cache)
  fichier: "data/lisi_capteurs.csv"
  # Export complet traçabilité (OF, pièce contrôlée, PAS_*, Nominal) — bascule Phase I3
  fichier_tracabilite: "data/lisi_capteurs_export_complet_tracabilite.csv"
  separateur: ";"
  encoding: "utf-8"

  colonnes:
    temps:      "Date"
    valeur:     "Value"
    tag:        "Tag"
    piece:      "Designation Reference"   # modèle produit (ex. RD4L1A1C) — ne pas confondre avec numero_piece
    numero_of:  "Numero OF MAR"
    numero_piece: "Numero Piece Contrôlée"
    operation:  "Operation"
    lti:        "LTI"
    lts:        "LTS"
    nominal:    "Nominal"
    machine:    "Numero Machine"
    matrice:    "Ref_Matrice"
    pas_e_fournisseur:      "PAS_E_Fournisseur"
    pas_e_niveau_retaille:  "PAS_E_Niveau_Retaille"
    pas_e_numero_passage:   "PAS_E_Numero_Passage"
    pas_i_fournisseur:      "PAS_I_Fournisseur"
    pas_i_niveau_retaille:  "PAS_I_Niveau_Retaille"
    pas_i_numero_passage:   "PAS_I_Numero_Passage"

  # Index pivot LONG → wide (consommé par S2 à partir de la Phase I2)
  pivot_index_keys:
    - temps
    - numero_piece
    - numero_of
    - piece
    - operation
    - machine
    - matrice

  # Agrégation F2 / OF — préconfigurée, désactivée jusqu'à validation métier (Phase ultérieure)
  agregation_metier_f2:
    enabled: false
    preferred_output: both
    default_unit: of_mar
    fallback_to_measure: true
    defaults:
      min_observations_per_unit: 6
      value_aggregation: mean
      min_units_per_group: 3
      min_units_for_cpk: 30
    unites:
      of_mar:
        enabled: true
        unit_column: "Numero OF MAR"
        label: "ordre de fabrication MAR"
      piece_controlee:
        enabled: false
        unit_column: "Numero Piece Contrôlée"
        label: "pièce contrôlée"

  operations_actives: ["FILAGE", "EQUATOR"]

  modeles_actifs:
    - "M2L1A1C"
    - "M2L1B"
    - "M3L1A1C"
    - "M3L1B"
    - "M4L1A1C"
    - "M4L1B"
    - "RD2L1A1C"
    - "RD3L1A1C"
    - "RD4L1A1C"
    - "RD4L1B"

  # Parsing S1 — spécifique client (synonymes, patterns pièce)
  s1_parsing:
    piece_patterns:
      - '\b(M[234]L1[A-Z0-9]+|RD[234]L1[A-Z0-9]+)\b'
      - '\b(M[A-Z0-9]{3,}|RD[A-Z0-9]{3,})\b'
    operations_synonymes:
      FILAGE: [filage, lfilage, au filage]
      EQUATOR:
        - equator
        - lequator
        - à l equator
        - a l equator
        - formage
        - au formage
        - profil formage
        - contrôle formage

  # Numero Machine = presse si FILAGE, four si EQUATOR
  machine_sens_par_operation:
    FILAGE:  "presse hydraulique"
    EQUATOR: "four de contrôle métrologique"

  # Ref_Matrice uniquement renseignée sur EQUATOR
  colonnes_par_operation:
    FILAGE:
      pertinentes:
        - "Numero Piece Contrôlée"
        - "Numero OF MAR"
        - "PAS_E_Fournisseur"
        - "PAS_E_Niveau_Retaille"
        - "PAS_E_Numero_Passage"
        - "PAS_I_Fournisseur"
        - "PAS_I_Niveau_Retaille"
        - "PAS_I_Numero_Passage"
        - "Numero Machine"
      non_pertinentes:
        - "Ref_Matrice"
    EQUATOR:
      pertinentes:
        - "Numero Piece Contrôlée"
        - "Numero OF MAR"
        - "Ref_Matrice"
        - "Numero Machine"
      non_pertinentes:
        - "PAS_E_Fournisseur"
        - "PAS_E_Niveau_Retaille"
        - "PAS_E_Numero_Passage"
        - "PAS_I_Fournisseur"
        - "PAS_I_Niveau_Retaille"
        - "PAS_I_Numero_Passage"

  regles_nettoyage:
    PAS_E_Niveau_Retaille:
      condition: "<= 0"
      action: "supprimer_si_invalide"
      description: "Niveau retaille pastille ext doit être négatif ou nul"
    PAS_I_Niveau_Retaille:
      condition: "<= 0"
      action: "supprimer_si_invalide"
      description: "Niveau retaille pastille int doit être négatif ou nul"
    PAS_E_Numero_Passage:
      valeurs_valides: ["P1", "P2"]
      action: "supprimer_si_invalide"
      description: "Passage pastille ext doit être P1 ou P2"
    PAS_I_Numero_Passage:
      valeurs_valides: ["P1", "P2"]
      action: "supprimer_si_invalide"
      description: "Passage pastille int doit être P1 ou P2"

# ============================================================
# ENTITES — dictionnaire métier vectorisable pour S1
# Chaque entité a une description en langage naturel
# ============================================================

entites:

  facteurs_analyse:
    FILAGE:
      fournisseur:
        description: "fournisseur des pastilles extérieures et intérieures utilisées lors du filage"
        colonne_ext: "PAS_E_Fournisseur"
        colonne_int: "PAS_I_Fournisseur"
        synonymes: [fournisseur pastille, origine pastille, fabricant pastille, pastille fournisseur, pastile, pastilles]
      niveau_retaille:
        description: "niveau d'usure ou de retaille des pastilles au filage — valeur négative ou nulle"
        colonne_ext: "PAS_E_Niveau_Retaille"
        colonne_int: "PAS_I_Niveau_Retaille"
        synonymes: [retaille, usure, usure pastille, degré de retaille, niveau usure, pastille usée, pastille neuve]
      passage:
        description: "numéro de passage de la pastille au filage — P1 ou P2"
        colonne_ext: "PAS_E_Numero_Passage"
        colonne_int: "PAS_I_Numero_Passage"
        synonymes: [numéro passage, premier passage, deuxième passage, P1, P2, nombre de passages]
    EQUATOR:
      matrice:
        description: "référence de la matrice de formage utilisée lors du contrôle métrologique EQUATOR"
        libelle_court: "Matrice"
        colonne: "Ref_Matrice"
        # F2 compact — références O + 7 chiffres + suffixe (ex. MATRIX_DEMO) ; exclut identifiants machine (ex. MACHINE_DEMO)
        group_value_pattern: '^O\d{7}[A-Z0-9-]*$'
        synonymes: [moule, ref matrice, référence matrice, outil de formage, matrice de formage]
    COMMUN:
      machine:
        description: "numéro de la presse au filage ou du four au contrôle EQUATOR — colonne Numero Machine"
        colonne: "Numero Machine"
        sens_par_operation:
          FILAGE: "presse hydraulique"
          EQUATOR: "four de contrôle métrologique"
        synonymes: [presse, four, machine, équipement, numéro machine, presse hydraulique, four de contrôle]

  groupes_variables:
    FILAGE:
      corde:
        description: "longueur de corde de l'aube mesurée aux sections CR1 CR2 CR3 lors du filage"
        pattern_tag: "CR[0-9]"
        unite: "mm"
        synonymes: [longueur corde, CR, section corde, corde]
      epaisseur_ba:
        description: "épaisseur du bord d'attaque de l'aube mesurée au filage"
        pattern_tag: "EP_BA"
        unite: "mm"
        synonymes: [bord attaque, BA, épaisseur attaque, épaisseur bord attaque]
      epaisseur_bf:
        description: "épaisseur du bord de fuite de l'aube mesurée au filage"
        pattern_tag: "EP_BF"
        unite: "mm"
        synonymes: [bord fuite, BF, épaisseur fuite, épaisseur bord fuite]
      epaisseur_centrale:
        description: "épaisseur centrale de l'aube mesurée au filage"
        pattern_tag: "EP_CENTRALE"
        unite: "mm"
        synonymes: [épaisseur milieu, section centrale, épaisseur centrale]
      pastille:
        description: "mesure liée aux pastilles extérieures et intérieures au filage"
        pattern_tag: "PAS_E|PAS_I"
        unite: null
        synonymes: [pastille, pastile, pastilles, pastille ext, pastille int]
    EQUATOR:
      forme:
        description: "forme géométrique de l'intrados de l'aube mesurée à différentes sections de corde lors du contrôle EQUATOR"
        pattern_tag: "*_INTRADOS_FORME"
        unite: "mm"
        synonymes:
          - profil
          - géométrie
          - forme intrados
          - intrados forme
          - profil intrados
          - forme de l'aube
      vrillage:
        description: "vrillage ou torsion angulaire de l'aube mesurée lors du contrôle EQUATOR"
        libelle_court: "Vrillage intrados CR50"
        pattern_tag: "*_INTRADOS_VRILLAGE"
        unite: "mm"
        synonymes: [torsion, twist, vrillage intrados, angle vrillage]
      desaxage:
        description: "désaxage ou décalage latéral de l'aube mesuré lors du contrôle EQUATOR"
        pattern_tag: "*_INTRADOS_DESAXAGE"
        unite: "mm"
        synonymes: [décalage, décentrage, désaxage intrados, décalage latéral]
      veine:
        description: "mesure de veine ou de surface de l'aube par scan laser lors du contrôle EQUATOR"
        pattern_tag: "VEINE_SCAN_*"
        unite: "mm"
        synonymes: [scan veine, surface veine, mesure laser, veine scan]

  intentions:

    conformite:
      description: "vérifier si les mesures respectent les tolérances LTI et LTS et si les pièces sont conformes EN9100"
      synonymes:
        - "conformes"
        - "bonnes"
        - "dans les tolérances"
        - "qualité"
        - "Cpk"
        - "anomalies"
        - "défauts"
        - "hors tolérance"
        - "sont bonnes"
        - "respectent"

    comparaison_groupes:
      description: "comparer l'impact d'un ou plusieurs facteurs sur la qualité des mesures entre groupes"
      synonymes:
        - "impact"
        - "influence"
        - "différence"
        - "comparer"
        - "meilleur"
        - "moins bon"
        - "qui"
        - "lequel"
        - "entre"
        - "versus"

    tendance:
      description: "détecter une dérive progressive ou une évolution dans le temps des mesures"
      synonymes:
        - "dérive"
        - "évolution"
        - "tendance"
        - "progression"
        - "augmente"
        - "diminue"
        - "stable"
        - "dérive dans le temps"

    anomalie:
      description: "détecter des valeurs aberrantes ponctuelles ou anormales dans les mesures"
      synonymes:
        - "anomalie"
        - "aberrant"
        - "suspect"
        - "bizarre"
        - "anormal"
        - "pic"
        - "valeur extrême"

    portrait_statistique:
      description: "portrait descriptif, normalité et ajustement de loi sur une ou plusieurs mesures"
      priorite: 80
      dispatcher_s3: [descriptive, normality, distribution_fit]
      synonymes:
        - "analyse"
        - "analyse-moi"
        - "analyse moi"
        - "portrait"
        - "portrait statistique"
        - "normale"
        - "loi normale"
        - "distribution"
        - "comment est distribuée"
        - "décris"
        - "décrire"
        - "statistiques de"
        - "caractérise"
        - "caractériser"

    diagnostic_causal:
      description: "facteurs associés à la variabilité — associations statistiques, pas causalité prouvée"
      priorite: 90
      dispatcher_s3: [anova_kruskal, dunn_posthoc]
      synonymes:
        - "influencent"
        - "influencent la"
        - "facteurs"
        - "quel facteur"
        - "quels facteurs"
        - "explique"
        - "expliquent"
        - "variance"
        - "pourquoi"
        - "ce qui impacte"
        - "ce qui dégrade"
        - "associés à"
        - "associé à"

    analyse_complete:
      description: "bilan analytique complet — portrait, corrélation, capabilité et comparaison si facteur"
      priorite: 100
      dispatcher_s3: [descriptive, normality, distribution_fit, correlation, cp_cpk, anova_kruskal]
      synonymes:
        - "analyse complète"
        - "analyse complete"
        - "bilan complet"
        - "bilan qualité complet"
        - "tout sur"
        - "portrait complet"
        - "analyse totale"
        - "analyse globale"

