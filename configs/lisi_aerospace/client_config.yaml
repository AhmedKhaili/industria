# ============================================================
# TEMPS — conventions temporelles et événements industriels
# ============================================================

temps:
  conventions:
    semaine:  "civile"      # lundi → dimanche
    mois:     "calendaire"  # 1er → dernier jour du mois
    trimestre: "calendaire"
  evenements:
    derniere_campagne:
      description: "dernière campagne de production enregistrée"
      jeton: "EVENT_LATEST_CAMPAIGN"
      requete_sql: "SELECT start_time, end_time FROM production_campaigns ORDER BY id DESC LIMIT 1"
    dernier_lot:
      description: "dernier lot de production"
      jeton: "EVENT_LATEST_LOT"
      requete_sql: "SELECT date_debut, date_fin FROM lots ORDER BY id DESC LIMIT 1"

# ============================================================
# RAPPORT PDF S7 — mise en page et libellés verdict
# ============================================================

rapport_pdf:
  version: "4.0"
  industria_version: "v4.0"
  mode: client_quality
  reference_prefix: RPT
  max_graphiques_directeur: 3
  max_graphiques_technicien: 12
  max_graphiques_operateur: 8
  max_graphiques_client: 3
  max_graphiques_complet: 8
  max_pages_complet: 12
  max_recommandations_client: 4
  sauvegarder_dans: "reports/"
  bandeau_defaut_couleur: "#1565C0"
  boxplots_prioritaires:
    - CR70_INTRADOS_FORME
    - CR90_INTRADOS_FORME
    - CR10_INTRADOS_FORME
  cpk_couleurs:
    critique: { max: 1.0, fond: "#FFEBEE" }
    limite: { min: 1.0, max: 1.33, fond: "#FFF3E0" }
    conforme: { min: 1.33, fond: "#E8F5E9" }
  verdict_bandeaux:
    NO_GO:
      fond: "#C62828"
      texte: "#FFFFFF"
      libelle: "NO-GO — Action corrective requise"
    NO_GO_OPERATIONNEL:
      fond: "#C62828"
      texte: "#FFFFFF"
      libelle: "NO-GO — Intervention urgente requise"
    SURVEILLANCE:
      fond: "#F57F17"
      texte: "#FFFFFF"
      libelle: "SURVEILLANCE — Suivi renforcé"
    GO:
      fond: "#2E7D32"
      texte: "#FFFFFF"
      libelle: "GO — Processus conforme"
  verdict_libelles:
    GO: "GO — Procédé sous contrôle"
    NO_GO: "NO-GO — Action corrective requise"
    NO_GO_OPERATIONNEL: "NO-GO opérationnel — Intervention urgente"
    SURVEILLANCE: "SURVEILLANCE — Suivi renforcé"

# ============================================================
# CONTRAT RAPPORT — exigences qualité du rapport final
# ============================================================

contrat_rapport:
  doit_contenir:
    - "Verdict GO / NO-GO explicite en première page"
    - "Cpk avec interprétation en langage métier"
    - "Graphique avec limites de tolérance LTI et LTS visibles"
    - "Recommandation actionnable avec délai précis"
    - "Unité de mesure sur tous les axes de graphique"
  ne_doit_jamais:
    - "Afficher p-value à un profil opérateur"
    - "Conclure aucune action si Cpk < 1.33"
    - "Afficher un axe de graphique sans unité"
    - "Donner un coût sans préciser les hypothèses"
  format_par_priorite:
    P1: {max_pages: 1,  titre: "Action immédiate requise"}
    P2: {max_pages: 3,  titre: "Intervention urgente"}
    P3: {max_pages: 10, titre: "Surveillance recommandée"}
    P4: {max_pages: 10, titre: "Rapport d'analyse"}

# ============================================================
# ANALYSE ÉTENDUE — plafonds S3/S5 (S3-extended §5)
# ============================================================

analyse_etendue:
  portrait_statistique:
    max_variables: 3
    max_specialistes_par_variable: 3
  analyse_complete:
    max_variables: 5
    max_specialistes_total: 8
    max_specialistes_par_variable: 3
    inclure_cp_cpk: true
    inclure_comparaison_groupes: true
  synthese_s5:
    avertissement_si_variables_gt: 3
    zero_llm_synthese: false

# ============================================================
# RECOMMANDATIONS S6 — priorités, délais, responsables
# ============================================================

recommandations:
  seuils_cpk:
    p1_sous: 1.0
    p2_sous: 1.33
    p3_sous: 1.67
  zscore:
    absolu_p1: 3.0
    anomaly_pct_p1: 20.0
    anomaly_pct_p2: 10.0
  delais:
    P1: "immédiat"
    P2: "48 heures"
    P3: "semaine en cours"
    P4: "surveillance standard"
  responsables_par_profil:
    operateur: "chef d'équipe"
    technicien: "responsable qualité"
    ingenieur: "direction technique"
    directeur: "direction générale"
  regroupement_causes:
    - colonne: "Numero Machine"
      label: "machine"
    - colonne: "Ref_Matrice"
      label: "matrice"
    - colonne: "PAS_E_Fournisseur"
      label: "fournisseur"
  rag:
    min_relevance: 0.7
    message_vide: "Aucune procédure locale trouvée. Contacter l'ingénieur procédé."
  pire_matrice:
    variable_pivot: "cpk_min"
    ex_aequo: "pct_hors_tolerance"
    critere_groupe: "pct_hors_tolerance"
  synthese_interdits:
    - "analysis_context"
    - "cpk_summary"
    - "anova_summary"
    - "trend_summary"
    - "descriptions_tabulaires"
    - "specialist_results"
    - "metrics_summary"
    - "intent S1"
    - "YAML client"
    - "Ref_Matrice"
    - "tableau présente"
    - "pipeline"
    - "fallback"
    - "LLM"
  detail_par_profil:
    directeur:
      inclure_priorites: ["P1", "P2", "P3", "P4"]
      agreger_p2_p3: true
      max_lignes_hors_p1: 2
    operateur:
      inclure_priorites: ["P1", "P2", "P3", "P4"]
      agreger_p2_p3: true
      max_lignes_hors_p1: 5
    technicien:
      inclure_priorites: ["P1", "P2", "P3", "P4"]
      agreger_p2_p3: false
    ingenieur:
      inclure_priorites: ["P1", "P2", "P3", "P4"]
      agreger_p2_p3: false

# ============================================================
# PROFILS UTILISATEURS
# ============================================================

profils:
  operateur:
    tokens_max: 150
    vocabulaire_simple: true
    forbidden_words:
      - "z-score"
      - "p-value"
      - "Cpk"
      - "sigma"
      - "ANOVA"
      - "Kruskal"
      - "Mann-Kendall"
  technicien:
    tokens_max: 250
    vocabulaire_simple: false
    forbidden_words: []
  ingenieur:
    tokens_max: 350
    vocabulaire_simple: false
    forbidden_words: []
  directeur:
    tokens_max: 200
    vocabulaire_simple: true
    forbidden_words:
      - "z-score"
      - "ANOVA"
      - "EWMA"
      - "CUSUM"
      - "p-value"

# ============================================================
# FINANCIER
# ============================================================

financier:
  cout_horaire_presse:  500
  cout_horaire_four:    300
  cout_rebut_piece:     45
  devise: "EUR"

# ============================================================
# RAG — documents techniques à indexer
# ============================================================

rag:
  actif: true
  dossier: "data/manuals/lisi/"
  collection_chroma: "lisi_aerospace"
  documents: []  # à remplir avec les manuels du client

# ============================================================
# FEW SHOT — exemples par type d'analyse
# ============================================================

few_shot:
  dossier: "data/few_shot/lisi/"
  fichiers:
    conformite:           "conformite.yaml"
    comparaison_groupes:  "comparaison.yaml"
    tendance:             "tendance.yaml"
    anomalie:             "anomalie.yaml"
